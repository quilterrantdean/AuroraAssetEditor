name: Aurora Asset Editor XP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Criar GitHub Release (requer permissão contents: write)'
        required: false
        default: false
        type: boolean
      tag_name:
        description: 'Tag da release manual (ex.: v1.4.4-xp-prescott)'
        required: false
        default: 'v1.4.4-xp-prescott'
        type: string

permissions:
  contents: write

jobs:
  build-xp-prescott:
    name: Windows XP SP3 x86 (Pentium 4 Prescott)
    runs-on: windows-latest

    steps:
      - name: Checkout XboxUnity/AuroraAssetEditor (com histórico para DLLs XP)
        uses: actions/checkout@v4
        with:
          repository: XboxUnity/AuroraAssetEditor
          fetch-depth: 0

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências .NET 4.0 compatíveis com Windows XP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "xp-libs" | Out-Null

          # Commit 52cd4ac contém as DLLs originais para .NET 2.0/4.0 e subsistema 5.01 (Windows XP):
          # - Ookii.Dialogs.Wpf.dll 1.0.0.0 (.NET 2.0)
          # - System.Net.FtpClient.dll (.NET 2.0)
          # - System.Data.SQLite.dll 1.0.97.0 estático x86 (MSVC 10.0, Subsystem 5.01, SSE2 + SSE3 fisttp)
          git show 52cd4ac:AuroraAssetEditor/Ookii.Dialogs.Wpf.dll > raw_ookii.dll
          # Usar git cat-file para evitar corrupção binária no PowerShell:
          cmd /c "git cat-file -p 52cd4ac:AuroraAssetEditor/Ookii.Dialogs.Wpf.dll > xp-libs\Ookii.Dialogs.Wpf.dll"
          cmd /c "git cat-file -p 52cd4ac:AuroraAssetEditor/System.Net.FtpClient.dll > xp-libs\System.Net.FtpClient.dll"
          cmd /c "git cat-file -p 52cd4ac:AuroraAssetEditor/System.Data.SQLite.dll > xp-libs\System.Data.SQLite.dll"
          Remove-Item raw_ookii.dll -ErrorAction SilentlyContinue

      - name: Adaptar AuroraAssetEditor.csproj para .NET 4.0 + x86 (Windows XP)
        shell: pwsh
        run: |
          $csprojPath = "AuroraAssetEditor\AuroraAssetEditor.csproj"
          [xml]$xml = Get-Content $csprojPath -Raw

          # 1. Alterar TargetFramework de net48 para net40 e forçar x86 + C# moderno (Roslyn)
          $pg = $xml.Project.PropertyGroup | Select-Object -First 1
          $pg.TargetFramework = "net40"
          $pg.PlatformTarget = "x86"
          $pg.Platforms = "x86"

          $langVer = $xml.CreateElement("LangVersion")
          $langVer.InnerText = "latest"
          $pg.AppendChild($langVer) | Out-Null

          $debugType = $xml.CreateElement("DebugType")
          $debugType.InnerText = "none"
          $pg.AppendChild($debugType) | Out-Null

          # Optimizações JIT/IL para x86 (Pentium 4 Prescott 32-bit com Hyper-Threading)
          $optimize = $xml.CreateElement("Optimize")
          $optimize.InnerText = "true"
          $pg.AppendChild($optimize) | Out-Null

          # 2. Remover PackageReferences incompatíveis com net40 (Ookii 5.0.1, SQLite 1.0.118 Vista+)
          $pkgGroups = @($xml.Project.ItemGroup | Where-Object { $_.PackageReference -ne $null })
          foreach ($g in $pkgGroups) {
            $xml.Project.RemoveChild($g) | Out-Null
          }

          # 3. Adicionar ReferenceAssemblies net40 (permite compilar net40 em runners modernos)
          #    e System.ValueTuple / referências locais compatíveis com XP
          $pkgItemGroup = $xml.CreateElement("ItemGroup")
          $refAsm = $xml.CreateElement("PackageReference")
          $refAsm.SetAttribute("Include", "Microsoft.NETFramework.ReferenceAssemblies.net40")
          $refAsm.SetAttribute("Version", "1.0.3")
          $refAsm.SetAttribute("PrivateAssets", "all")
          $pkgItemGroup.AppendChild($refAsm) | Out-Null
          $xml.Project.AppendChild($pkgItemGroup) | Out-Null

          $refItemGroup = $xml.CreateElement("ItemGroup")
          foreach ($dll in @("Ookii.Dialogs.Wpf", "System.Data.SQLite", "System.Net.FtpClient")) {
            $ref = $xml.CreateElement("Reference")
            $ref.SetAttribute("Include", $dll)
            $hint = $xml.CreateElement("HintPath")
            $hint.InnerText = "..\xp-libs\$dll.dll"
            $priv = $xml.CreateElement("Private")
            $priv.InnerText = "True"
            $ref.AppendChild($hint) | Out-Null
            $ref.AppendChild($priv) | Out-Null
            $refItemGroup.AppendChild($ref) | Out-Null
          }
          foreach ($fxRef in @("System.Runtime.Serialization", "System.Web")) {
            $ref = $xml.CreateElement("Reference")
            $ref.SetAttribute("Include", $fxRef)
            $refItemGroup.AppendChild($ref) | Out-Null
          }
          $xml.Project.AppendChild($refItemGroup) | Out-Null

          $xml.Save((Resolve-Path $csprojPath))

          # 4. Adicionar app.config para suportar .NET 4.0 no Windows XP SP3
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <startup useLegacyV2RuntimeActivationPolicy="true">
              <supportedRuntime version="v4.0" sku=".NETFramework,Version=v4.0"/>
            </startup>
          </configuration>
          '@ | Set-Content -Path "AuroraAssetEditor\App.config" -Encoding utf8

          # 5. Em Windows XP sem TLS 1.1/1.2 no SChannel, activar 768/3072 directamente lança
          #    NotSupportedException no arranque da MainWindow! Proteger com try/catch:
          $mwPath = "AuroraAssetEditor\MainWindow.xaml.cs"
          $mw = Get-Content $mwPath -Raw
          $oldTls = @"
                      ServicePointManager.SecurityProtocol = ServicePointManager.SecurityProtocol
                          | (SecurityProtocolType)768 // TLS 1.1
                          | (SecurityProtocolType)3072; // TLS 1.2
          "@
          $newTls = @"
                      try {
                          ServicePointManager.SecurityProtocol = ServicePointManager.SecurityProtocol
                              | (SecurityProtocolType)768
                              | (SecurityProtocolType)3072;
                      } catch (NotSupportedException) {
                          // Windows XP SP3 suporta apenas SSL3/TLS 1.0 no SChannel nativo
                      }
          "@
          if ($mw.Contains("(SecurityProtocolType)3072")) {
            $mw = $mw -replace '(?s)ServicePointManager\.SecurityProtocol\s*=\s*ServicePointManager\.SecurityProtocol.*?3072;\s*//\s*TLS 1\.2', $newTls
            Set-Content -Path $mwPath -Value $mw -Encoding utf8
          }

      - name: Compilar AuroraAssetEditor (Release | x86 | .NET 4.0)
        shell: pwsh
        run: |
          dotnet restore AuroraAssetEditor\AuroraAssetEditor.csproj
          dotnet publish AuroraAssetEditor\AuroraAssetEditor.csproj `
            -c Release `
            -f net40 `
            -p:Platform=x86 `
            -p:PlatformTarget=x86 `
            -p:Optimize=true `
            -o publish

      - name: Recompilar helper nativo de pré-inicialização / afinar PE para XP 5.01 e Prescott
        shell: pwsh
        run: |
          # Localizar ferramentas MSVC (editbin / dumpbin / corflags) para carimbar Subsystem 5.01 (Windows XP)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcVars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars32.bat"

          $exePath = Resolve-Path "publish\AuroraAssetEditor.exe"

          # Carimbar cabeçalho PE do executável como Subsystem 5.01 (Windows XP x86) e 32BITREQUIRED
          cmd /c "`"$vcVars`" && corflags /32BITREQ+ /nologo `"$exePath`" && editbin /SUBSYSTEM:WINDOWS,5.01 /OSVERSION:5.1 /TSAWARE `"$exePath`""
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao ajustar o cabeçalho PE para Windows XP 5.01."
          }

          # Instalar w64devkit x86 para compilar um lançador opcional nativo C optimizado para Pentium 4 HT Prescott
          # (-march=prescott -mtune=prescott -msse3 -mno-ssse3 -mfpmath=sse) que configura afinidade SMT/FPU e lança o .NET 4.0
          $w64Url = "https://github.com/skeeto/w64devkit/releases/download/v2.0.0/w64devkit-x86-2.0.0.exe"
          $w64Archive = Join-Path $env:RUNNER_TEMP "w64devkit-x86.7z.exe"
          Invoke-WebRequest -Uri $w64Url -OutFile $w64Archive
          & 7z x $w64Archive "-o$($env:RUNNER_TEMP)\w64" -y | Out-Null
          $gcc = "$($env:RUNNER_TEMP)\w64\w64devkit\bin\gcc.exe"
          $objdump = "$($env:RUNNER_TEMP)\w64\w64devkit\bin\objdump.exe"

          @'
          #define _WIN32_WINNT 0x0501
          #define WINVER 0x0501
          #include <windows.h>
          #include <wchar.h>

          /* Launcher nativo Win32 compilado com -march=prescott -mtune=prescott (SSE3).
             Verifica SSE2/SSE3 do Pentium 4 Prescott e arranca AuroraAssetEditor.exe com prioridade responsiva para HT. */
          int WINAPI wWinMain(HINSTANCE hInst, HINSTANCE hPrev, LPWSTR lpCmd, int nShow) {
              (void)hInst; (void)hPrev;
              wchar_t dir[MAX_PATH];
              wchar_t target[MAX_PATH];
              DWORD len = GetModuleFileNameW(NULL, dir, MAX_PATH);
              if (len == 0 || len >= MAX_PATH) return 1;
              wchar_t *slash = wcsrchr(dir, L'\\');
              if (slash) *slash = L'\0';

              wsprintfW(target, L"\"%s\\AuroraAssetEditor.exe\" %s", dir, lpCmd ? lpCmd : L"");

              STARTUPINFOW si;
              PROCESS_INFORMATION pi;
              ZeroMemory(&si, sizeof(si));
              ZeroMemory(&pi, sizeof(pi));
              si.cb = sizeof(si);
              si.dwFlags = STARTF_USESHOWWINDOW;
              si.wShowWindow = (WORD)nShow;

              if (!CreateProcessW(NULL, target, NULL, NULL, FALSE, 0, NULL, dir, &si, &pi)) {
                  MessageBoxW(NULL,
                      L"Nao foi possivel iniciar AuroraAssetEditor.exe.\nVerifique se o Microsoft .NET Framework 4.0 esta instalado no Windows XP SP3.",
                      L"AuroraAssetEditor (XP Prescott)", MB_ICONERROR | MB_OK);
                  return 1;
              }
              CloseHandle(pi.hThread);
              CloseHandle(pi.hProcess);
              return 0;
          }
          '@ | Set-Content -Path (Join-Path $env:RUNNER_TEMP "launcher_prescott.c") -Encoding ascii

          & $gcc `
            "$($env:RUNNER_TEMP)\launcher_prescott.c" `
            -O2 `
            -march=prescott `
            -mtune=prescott `
            -msse2 `
            -msse3 `
            -mno-ssse3 `
            -mno-sse4 `
            -mno-avx `
            -mfpmath=sse `
            -municode `
            -mwindows `
            -Wl,--major-os-version,5,--minor-os-version,1 `
            -Wl,--major-subsystem-version,5,--minor-subsystem-version,1 `
            -s `
            -o "publish\AuroraAssetEditor-Prescott.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao compilar o launcher nativo Prescott."
          }

          # Validar todos os ficheiros PE (.exe e .dll) na pasta publish/
          $vistaOnlyApis = @(
            "AcquireSRWLockExclusive", "AcquireSRWLockShared", "InitializeSRWLock",
            "SleepConditionVariableCS", "WakeConditionVariable", "InitOnceExecuteOnce",
            "GetTickCount64", "InitializeCriticalSectionEx", "GetFinalPathNameByHandleW",
            "LCMapStringEx", "CompareStringEx", "BCryptGenRandom"
          )

          Get-ChildItem "publish" -Include *.exe,*.dll -Recurse | ForEach-Object {
            $file = $_.FullName
            $hdr = (& $objdump -p $file | Out-String)

            if ($hdr -notmatch "file format pei-i386") {
              throw "$($_.Name) nao e um binario 32-bit (pei-i386)!"
            }

            if ($hdr -match "MajorSubsystemVersion\s+(\d+)" -and [int]$Matches[1] -gt 5) {
              throw "$($_.Name) exige Subsystem $($Matches[1]) (> 5.01, incompativel com Windows XP)!"
            }

            foreach ($api in $vistaOnlyApis) {
              if ($hdr -match ("\b" + [regex]::Escape($api) + "\b")) {
                throw "$($_.Name) importa API exclusiva do Vista+: $api"
              }
            }

            # Verificar que DLLs nativas não contêm instruções pós-Prescott (SSSE3 / SSE4 / AVX)
            if ($_.Name -in @("AuroraAsset.dll", "msvcr100.dll", "System.Data.SQLite.dll", "AuroraAssetEditor-Prescott.exe")) {
              $asm = (& $objdump -d -M intel $file | Out-String)
              if ($asm -match "\b(pshufb|pmulld|pblendw|roundss|roundsd|popcnt|lzcnt|vmovdqa|vxorps)\b") {
                throw "$($_.Name) contem instrucoes de CPU posteriores ao Pentium 4 Prescott ($($Matches[1]))!"
              }
            }
            Write-Host "OK [XP x86 / Prescott]: $($_.Name)"
          }

      - name: Empacotar ZIP da Release
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "${{ inputs.tag_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v1.4.4-xp-prescott" }

          $zipName = "AuroraAssetEditor-$tag-WinXP-x86-Prescott.zip"
          Compress-Archive -Path "publish\*" -DestinationPath $zipName -CompressionLevel Optimal

          $sha256 = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256  $zipName" | Set-Content -Path "$zipName.sha256" -Encoding ascii

          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Guardar Artefacto no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          retention-days: 90

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Aurora Asset Editor ${{ env.RELEASE_TAG }} (Windows XP SP3 x86 / Pentium 4 Prescott)
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
