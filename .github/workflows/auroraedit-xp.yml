name: Aurora Asset Editor XP (Prescott + OpenSSL TLS 1.3)

# Pipeline curto: todo o código auxiliar vive em xp-port/.
#   1. Checkout deste fork -> xp-port/ copiado para um diretório temporário.
#   2. Checkout fresco do upstream XboxUnity/AuroraAssetEditor (histórico
#      completo, necessário para o commit 52cd4ac com as DLLs XP).
#   3. build-tls.sh     -> zlib + OpenSSL + libcurl estáticos + AuroraTls.dll
#   4. apply-xp-fixes.ps1 -> net40 / x86 / DLLs XP / AuroraHttpClient
#   5. dotnet publish   -> publish/
#   6. verify-xp.ps1    -> auditoria PE + smoke-test TLS 1.3 em 32 bits
#   7. ZIP + SHA256 -> Artifact (90 dias) + Release opcional

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Criar GitHub Release (requer contents: write)'
        required: false
        default: false
        type: boolean
      tag_name:
        description: 'Tag da release manual (ex.: v1.4.3-xp-prescott)'
        required: false
        default: 'v1.4.3-xp-prescott'
        type: string

permissions:
  contents: write

env:
  DEPS_PREFIX: 'C:/xp-prescott-deps'
  ZLIB_VERSION: '1.3.1'
  OPENSSL_VERSION: '1.1.1w'
  CURL_VERSION: '8.11.0'

jobs:
  build-xp-prescott:
    name: Windows XP SP3 x86 (Pentium 4 Prescott + OpenSSL)
    runs-on: windows-latest

    steps:
      - name: Checkout do fork (fonte do xp-port)
        uses: actions/checkout@v4
        with:
          path: port
          persist-credentials: false

      - name: Guardar xp-port em diretório temporário
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'xp-port'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path 'port/xp-port/*' -Destination $dest -Recurse -Force
          "XP_PORT=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout fresco do upstream (histórico completo para as DLLs XP)
        uses: actions/checkout@v4
        with:
          repository: XboxUnity/AuroraAssetEditor
          fetch-depth: 0
          path: src
          clean: true
          persist-credentials: false

      # MINGW32 (msvcrt, 32 bits) é o único ambiente MSYS2 que produz binários
      # compatíveis com XP - o runtime UCRT (UCRT64) não existe no XP.  A MSYS2
      # está a descontinuar o MINGW32; o aviso de depreciação no log é esperado.
      - name: Configurar MSYS2 (MinGW32 i686)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-toolchain
            perl
            make
            diffutils
            curl

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache das bibliotecas estáticas XP/Prescott
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: xp-prescott-tls-${{ hashFiles('port/xp-port/build-tls.sh') }}-zlib${{ env.ZLIB_VERSION }}-ossl${{ env.OPENSSL_VERSION }}-curl${{ env.CURL_VERSION }}

      - name: Compilar zlib + OpenSSL + libcurl + AuroraTls.dll
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          XP_PORT_UNIX="$(cygpath -u "${XP_PORT}")"
          bash "${XP_PORT_UNIX}/build-tls.sh"

      - name: Aplicar fixes XP (.NET 4.0 / x86 / AuroraHttpClient)
        shell: pwsh
        run: |
          & "${env:XP_PORT}/apply-xp-fixes.ps1" -RepoRoot 'src' -XpPortDir $env:XP_PORT

      - name: Compilar AuroraAssetEditor (Release | x86 | .NET 4.0)
        shell: pwsh
        run: |
          dotnet restore 'src/AuroraAssetEditor/AuroraAssetEditor.csproj'
          dotnet publish 'src/AuroraAssetEditor/AuroraAssetEditor.csproj' `
            -c Release -f net40 -p:Platform=x86 -p:PlatformTarget=x86 -p:Optimize=true -o publish

          Copy-Item "$env:RUNNER_TEMP/xp-native/AuroraTls.dll" 'publish/AuroraTls.dll' -Force
          Copy-Item "$env:RUNNER_TEMP/xp-native/cacert.pem" 'publish/cacert.pem' -Force

      - name: Verificar XP/Prescott + smoke-test TLS 1.3
        shell: pwsh
        run: |
          & "${env:XP_PORT}/verify-xp.ps1" -PublishDir 'publish' -ObjdumpPath 'C:/msys64/mingw32/bin/objdump.exe'

      - name: Empacotar ZIP + SHA256
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag_name }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = 'v1.4.3-xp-prescott' }

          $zip = "AuroraAssetEditor-$tag-WinXP-x86-Prescott-TLS13.zip"
          Compress-Archive -Path 'publish/*' -DestinationPath $zip -CompressionLevel Optimal

          $sha = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $zip" | Set-Content -Path "$zip.sha256" -Encoding ascii

          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Guardar Artefacto no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          retention-days: 90

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Aurora Asset Editor ${{ env.RELEASE_TAG }} (Windows XP SP3 x86 / Prescott / OpenSSL TLS 1.3)
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
